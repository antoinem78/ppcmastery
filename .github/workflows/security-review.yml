# Anthropic's claude-code-security-review runs the same security audit we ran by
# hand, automatically on every pull request — it reviews ONLY the PR's diff and
# posts findings as inline PR comments. Requires an ANTHROPIC_API_KEY repo secret
# (Settings -> Secrets and variables -> Actions). Also runnable on demand from the
# Actions tab (workflow_dispatch).
name: Security Review

on:
  pull_request:
    # Skip pure-docs PRs; review anything that touches real code/config.
    paths:
      - "src/**"
      - "proposal-engine/**"
      - "supabase/**"
      - "package.json"
      - "next.config.ts"
  workflow_dispatch:

# Don't stack reviews on rapid pushes to the same PR.
concurrency:
  group: security-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  security-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the action can diff the PR base

      - name: Claude security review
        uses: anthropics/claude-code-security-review@main
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          comment-pr: true
